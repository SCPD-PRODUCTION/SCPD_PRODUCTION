<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCPD_PRODUCTION</title>
  
  <!-- Fav Icon -->
  <link rel="shortcut icon" href="./assets/scpd.png" type="image/x-icon">
    
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <img src="assets/logo.png" alt="SCPD_PRODUCTION Logo">
            <h1>SCPD_PRODUCTION</h1>
        </div>
    </header>

    <main>
        <section class="social-section">
            <a href="https://www.tiktok.com/@scpd_production" target="_blank" class="btn-social">
                <img src="assets/tiktok.png" alt="TikTok Logo"> TikTok
            </a>
            <a href="https://www.instagram.com/scpd_production" target="_blank" class="btn-social">
                <img src="assets/instagram.png" alt="Instagram Logo"> Instagram
            </a>
            <a href="https://youtube.com/@scpd_production12x" target="_blank" class="btn-social">
                <img src="assets/youtube.png" alt="YouTube Logo"> YouTube
            </a>
            <a href="https://whatsapp.com/channel/0029VbC1VsVLdQelkgv77e14" target="_blank" class="btn-social">
                <img src="assets/saluran.png" alt="saluran Logo"> saluran
            </a>
            <a href="https://wa.me/+6288976424767" target="_blank" class="btn-social">
                <img src="assets/whatsapp.png" alt="whatsapp Logo"> contact person
            </a>
        </section>

        <section class="products">
            <h2>Produk Kami</h2>
            <div id="product-container" class="product-list">
                <!-- Produk akan muncul dari data.json -->
            </div>
        </section>

        <section class="contents">
            <h2>Konten Kami</h2>
            <div id="content-container" class="content-list">
                <!-- Konten akan muncul dari data.json -->
            </div>
        </section>
    </main>
</div>

<script>
async function loadProducts() {
    const res = await fetch("data.json");
    const data = await res.json();
    const container = document.getElementById("product-container");
    container.innerHTML = "";
    data.products.forEach(p => {
        container.innerHTML += `
            <div class="product-card">
                <img src="${p.image}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p>${p.price}</p>
            </div>
        `;
    });
}

async function loadContents() {
    const res = await fetch("data.json");
    const data = await res.json();
    const container = document.getElementById("content-container");
    container.innerHTML = "";
    data.contents.forEach(c => {
        container.innerHTML += `
            <div class="content-card">
                <h3>${c.title}</h3>
                <p>${c.body}</p>
            </div>
        `;
    });
}

loadProducts();
loadContents();
</script>

</body>
</html>
